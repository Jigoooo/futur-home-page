name: CI & Deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b --noEmit

      - name: Build production bundle
        run: pnpm build

      - name: Upload verified Nitro output
        uses: actions/upload-artifact@v4
        with:
          name: nitro-output-${{ github.sha }}
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deployment-contract:
    name: Deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_WEB_SERVER: '1'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release and workflow contracts
        run: >-
          pnpm exec playwright test
          e2e/deployment-contract.chrome.spec.ts
          e2e/deployment-release-script.chrome.spec.ts
          --project=chrome --workers=1 --retries=0

  e2e:
    name: Production E2E (${{ matrix.shard }}/4)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
      PLAYWRIGHT_E2E: '1'
      PLAYWRIGHT_PRODUCTION_SERVER: '1'
      PLAYWRIGHT_SKIP_WEB_SERVER: '1'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_CI_LIGHT_PARTICLES: '1'
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome

      - name: Download verified Nitro output
        uses: actions/download-artifact@v4
        with:
          name: nitro-output-${{ github.sha }}
          path: .output

      - name: Run production E2E shard
        env:
          PLAYWRIGHT_E2E: '1'
        run: |
          set -Eeuo pipefail
          env PLAYWRIGHT_E2E=1 PORT=3000 node .output/server/index.mjs > "$RUNNER_TEMP/futur-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          pnpm exec wait-on http://127.0.0.1:3000 --timeout 60000
          mapfile -t specs < <(
            find e2e -type f \( -name '*.chrome.spec.ts' -o -name '*.a11y.spec.ts' \) \
              ! -name 'deployment-contract.chrome.spec.ts' \
              ! -name 'deployment-release-script.chrome.spec.ts' \
              ! -name 'landing-hero-cinematic.chrome.spec.ts' \
              -print | sort
          )
          pnpm exec playwright test "${specs[@]}" --shard="${SHARD}/4" --workers=1

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  hero-e2e:
    name: Hero E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      PLAYWRIGHT_E2E: '1'
      PLAYWRIGHT_PRODUCTION_SERVER: '1'
      PLAYWRIGHT_SKIP_WEB_SERVER: '1'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_CI_LIGHT_PARTICLES: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome

      - name: Download verified Nitro output
        uses: actions/download-artifact@v4
        with:
          name: nitro-output-${{ github.sha }}
          path: .output

      - name: Run the Hero interaction and production-tier contract suite
        run: |
          set -Eeuo pipefail
          env PLAYWRIGHT_E2E=1 PORT=3000 node .output/server/index.mjs > "$RUNNER_TEMP/futur-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          pnpm exec wait-on http://127.0.0.1:3000 --timeout 60000
          pnpm exec playwright test e2e/landing-hero-cinematic.chrome.spec.ts \
            --project=chrome --workers=1 --timeout=90000 --retries=1

      - name: Upload Hero Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hero-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy production release
    needs: [quality, deployment-contract, e2e, hero-e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: futur-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
      CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
      CONTACT_RATE_LIMIT_SALT: ${{ secrets.CONTACT_RATE_LIMIT_SALT }}
      CONTACT_TRUST_PROXY: ${{ secrets.CONTACT_TRUST_PROXY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Nitro output
        uses: actions/download-artifact@v4
        with:
          name: nitro-output-${{ github.sha }}
          path: .output

      - name: Prepare SSH and release package
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -m 600 /dev/null "$RUNNER_TEMP/futur_deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/futur_deploy_key"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > "$RUNNER_TEMP/futur_known_hosts"
          tar -C .output -czf "$RUNNER_TEMP/futur-output.tar.gz" .
          {
            printf 'RESEND_API_KEY=%q\n' "$RESEND_API_KEY"
            printf 'CONTACT_FROM_EMAIL=%q\n' "$CONTACT_FROM_EMAIL"
            printf 'CONTACT_TO_EMAIL=%q\n' "$CONTACT_TO_EMAIL"
            printf 'CONTACT_RATE_LIMIT_SALT=%q\n' "$CONTACT_RATE_LIMIT_SALT"
            printf 'CONTACT_TRUST_PROXY=%q\n' "$CONTACT_TRUST_PROXY"
          } > "$RUNNER_TEMP/futur-runtime.env"

      - name: Upload and activate release
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/futur_deploy_key"
            -o "UserKnownHostsFile=$RUNNER_TEMP/futur_known_hosts"
            -o StrictHostKeyChecking=yes
            -p "$SSH_PORT"
          )
          remote="${SSH_USERNAME}@${SSH_HOST}"
          incoming="${DEPLOY_PATH%/}/.incoming/${GITHUB_SHA}"
          printf -v prepare_command '%q ' mkdir -p "$incoming"
          ssh "${ssh_options[@]}" "$remote" "$prepare_command"
          scp -q -P "$SSH_PORT" \
            -i "$RUNNER_TEMP/futur_deploy_key" \
            -o "UserKnownHostsFile=$RUNNER_TEMP/futur_known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/futur-output.tar.gz" \
            "$RUNNER_TEMP/futur-runtime.env" \
            deploy/pm2/ecosystem.config.cjs \
            deploy/scripts/deploy-release.sh \
            "$remote:$incoming/"
          printf -v deploy_command '%q ' bash "$incoming/deploy-release.sh" deploy "$DEPLOY_PATH" "$GITHUB_SHA" "$incoming"
          ssh "${ssh_options[@]}" "$remote" "$deploy_command"

      - name: Verify public HTTPS and finalize
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/futur_deploy_key"
            -o "UserKnownHostsFile=$RUNNER_TEMP/futur_known_hosts"
            -o StrictHostKeyChecking=yes
            -p "$SSH_PORT"
          )
          remote="${SSH_USERNAME}@${SSH_HOST}"
          incoming="${DEPLOY_PATH%/}/.incoming/${GITHUB_SHA}"
          public_ok='false'
          for attempt in {1..12}; do
            if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' \
              "https://futur.co.kr/?deploy=${GITHUB_SHA}" | grep -Fq 'BUILT FOR WHAT'; then
              public_ok='true'
              break
            fi
            sleep 5
          done
          if [[ "$public_ok" != 'true' ]]; then
            printf -v rollback_command '%q ' bash "$incoming/deploy-release.sh" rollback "$DEPLOY_PATH" "$GITHUB_SHA" "$incoming"
            ssh "${ssh_options[@]}" "$remote" "$rollback_command"
            exit 1
          fi
          printf -v finalize_command '%q ' bash "$incoming/deploy-release.sh" finalize "$DEPLOY_PATH" "$GITHUB_SHA" "$incoming"
          ssh "${ssh_options[@]}" "$remote" "$finalize_command"
